name: Build & Release

on:
  push:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version increment type for the next release'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (with tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compute next version
        id: version
        run: |
          LATEST=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          CURRENT=$(sed -n "s/.*versionName '\([0-9][0-9.]*\)'.*/\1/p" app/build.gradle | head -n 1)
          LATEST_VERSION="${LATEST#v}"
          if [ -n "$CURRENT" ] && [ "$CURRENT" != "$LATEST_VERSION" ]; then
            VERSION="$CURRENT"
            BUMP_SOURCE="app/build.gradle"
          else
            BUMP_TYPE="patch"
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
              BUMP_TYPE="${{ inputs.bump_type }}"
            fi
            IFS='.' read -r MAJOR MINOR PATCH <<< "${LATEST_VERSION:-1.0.0}"
            case "$BUMP_TYPE" in
              major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
              patch) PATCH=$((PATCH + 1)) ;;
              *) echo "Unsupported bump type: $BUMP_TYPE"; exit 1 ;;
            esac
            VERSION="${MAJOR}.${MINOR}.${PATCH}"
            BUMP_SOURCE="$BUMP_TYPE"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "previous_tag=$LATEST" >> "$GITHUB_OUTPUT"
          echo "Next version: $VERSION (source: $BUMP_SOURCE, previous tag: $LATEST)"

      - name: Bump version in app/build.gradle
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          perl -0pi -e "s/versionCode \d+/versionCode $VERSION_CODE/; s/versionName '[0-9.]+'/versionName '$VERSION'/" app/build.gradle
          grep -E "versionCode|versionName" app/build.gradle

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle
          git commit -m "chore: bump version to ${{ steps.version.outputs.version }}" || echo "no changes"
          git push

      - name: Create tag
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          git tag "$TAG"
          git push origin "$TAG"

      - name: Generate release changelog
        id: changelog
        env:
          PREVIOUS_TAG: ${{ steps.version.outputs.previous_tag }}
        run: |
          if [ -n "$PREVIOUS_TAG" ]; then
            RANGE="${PREVIOUS_TAG}..HEAD"
          else
            RANGE="HEAD"
          fi
          {
            echo 'body<<CHANGELOG_EOF'
            git log "$RANGE" --pretty=format:'- %s (%h)' \
              --invert-grep --grep='^chore: bump version to '
            echo
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: liri-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body: ${{ steps.changelog.outputs.body }}
          files: app/build/outputs/apk/debug/*.apk
