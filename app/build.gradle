plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'io.github.rikumi.lyrichelper'
    compileSdk 37
    defaultConfig {
        applicationId 'io.github.rikumi.lyrichelper'
        minSdk 26
        targetSdk 35
        versionCode 20108
        versionName '2.1.8'
    }
    signingConfigs {
        release {
            storeFile file("${rootDir}/release-key.jks")
            storePassword System.getenv('LIRI_KEYSTORE_PASSWORD')
            keyAlias 'liri-release'
            keyPassword System.getenv('LIRI_KEY_PASSWORD')
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlin { jvmToolchain(21) }
    buildFeatures { compose true }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    implementation 'io.github.suqi8.coui.kmp:coui-ui:1.1.0'
    implementation 'io.github.suqi8.coui.kmp:coui-preference:1.1.0'
    implementation 'io.github.suqi8.coui.kmp:coui-icons:1.1.0'
    implementation 'androidx.navigationevent:navigationevent-compose:1.1.2'
    implementation 'com.android.volley:volley:1.2.1'
    testImplementation 'junit:junit:4.13.2'
}
